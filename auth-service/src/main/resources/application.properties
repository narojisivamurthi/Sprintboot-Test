# Auth Service Configuration
server.port=8081
spring.application.name=auth-service

# Database Configuration (Local MongoDB by default)
spring.data.mongodb.host=${MONGO_HOST:localhost}
spring.data.mongodb.port=${MONGO_PORT:27017}
spring.data.mongodb.database=${MONGO_DATABASE:employee_db}
spring.data.mongodb.uri=mongodb://${spring.data.mongodb.host}:${spring.data.mongodb.port}/${spring.data.mongodb.database}?serverSelectionTimeoutMS=2000

# JWT Properties
app.jwt-secret=${JWT_SECRET:9a2f8c4e7b1d3a5f8e0c2b4a6f8d1e3c5b7a9f0e2d4c6b8a1f3e5d7c9b0a2f4e}
app.jwt-expiration-milliseconds=86400000
