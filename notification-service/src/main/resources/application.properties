# Notification Service Configuration
server.port=8083
spring.application.name=notification-service

# Mail Configuration (Defaults to Gmail SMTP with environment variable overrides)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Default Sender Address
notification.mail.from=${MAIL_FROM:noreply@employeeportal.com}

# Simulation Mode: If credentials are not provided or SIMULATE_MAIL=true, emails are logged to console and stored in history rather than failing
notification.mail.simulate=${SIMULATE_MAIL:auto}

# Swagger UI and OpenAPI documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
