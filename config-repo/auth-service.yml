server:
  port: ${AUTH_SERVICE_PORT:8081}

spring:
  application:
    name: auth-service
  data:
    mongodb:
      host: ${MONGO_HOST:localhost}
      port: ${MONGO_PORT:27017}
      database: ${MONGO_DATABASE:employee_db}

jwt:
  secret: ${JWT_SECRET:9a2f8c4e7b1d3a5f8e0c2b4a6f8d1e3c5b7a9f0e2d4c6b8a1f3e5d7c9b0a2f4e}
  expiration: 86400000 # 24 hours in ms
