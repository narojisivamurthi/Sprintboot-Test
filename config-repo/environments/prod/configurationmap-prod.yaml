# ==============================================================================
# KUBERNETES CONFIGMAP: PRODUCTION ENVIRONMENT (PROD)
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: microservices-configmap
  namespace: production
data:
  # Downstream Microservice Base URLs (Prod internal VPC / K8s internal DNS)
  NOTIFICATION_SERVICE_BASE_URL: "http://notification-service.production.svc.cluster.local:8083"
  EMPLOYEE_SERVICE_BASE_URL: "http://employee-service.production.svc.cluster.local:8082"
  AUTH_SERVICE_BASE_URL: "http://auth-service.production.svc.cluster.local:8081"
  GATEWAY_BASE_URL: "https://api.employeeportal.company.com"

  # Notification Service Endpoint Paths
  NOTIFICATION_SERVICE_SEND_EMAIL: "/api/notifications/send"
  NOTIFICATION_SERVICE_SEND_WELCOME_EMAIL: "/api/notifications/welcome"
  NOTIFICATION_SERVICE_HEALTH: "/api/notifications/health"

  # Auth Service Endpoint Paths
  AUTH_SERVICE_VALIDATE_TOKEN: "/api/auth/validate"
  AUTH_SERVICE_ME: "/api/auth/me"

  # Environment Indicator
  ENVIRONMENT: "prod"
