# ==============================================================================
# EMPLOYEE SERVICE CONFIGURATION
# ==============================================================================
server:
  port: ${EMPLOYEE_SERVICE_PORT:8082}

spring:
  application:
    name: employee-service
  data:
    mongodb:
      host: ${MONGO_HOST:localhost}
      port: ${MONGO_PORT:27017}
      database: ${MONGO_DATABASE:employee_db}
      uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DATABASE:employee_db}?serverSelectionTimeoutMS=2000
  cache:
    type: ${CACHE_TYPE:simple}

# Downstream Microservices URLs & Endpoints
external:
  services:
    notification:
      base-url: ${NOTIFICATION_SERVICE_BASE_URL:http://localhost:8083}
      send-email: ${NOTIFICATION_SERVICE_SEND_EMAIL:/api/notifications/send}
      send-welcome-email: ${NOTIFICATION_SERVICE_SEND_WELCOME_EMAIL:/api/notifications/welcome}
      health: ${NOTIFICATION_SERVICE_HEALTH:/api/notifications/health}
    auth:
      base-url: ${AUTH_SERVICE_BASE_URL:http://localhost:8081}
      validate-token: ${AUTH_SERVICE_VALIDATE_TOKEN:/api/auth/validate}
      me: ${AUTH_SERVICE_ME:/api/auth/me}
