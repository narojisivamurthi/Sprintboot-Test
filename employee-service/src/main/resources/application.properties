# Employee Service Configuration
server.port=8082
spring.application.name=employee-service

# Database Configuration (Local MongoDB by default)
spring.data.mongodb.host=${MONGO_HOST:localhost}
spring.data.mongodb.port=${MONGO_PORT:27017}
spring.data.mongodb.database=${MONGO_DATABASE:employee_db}
spring.data.mongodb.uri=mongodb://${spring.data.mongodb.host}:${spring.data.mongodb.port}/${spring.data.mongodb.database}?serverSelectionTimeoutMS=2000

# Cache Configuration (in-memory simple cache for fast responses)
spring.cache.type=${CACHE_TYPE:simple}

# External Downstream Notification Service Configuration (Overridable via ConfigMap / Environment)
external.services.notification.base-url=${NOTIFICATION_SERVICE_BASE_URL:http://localhost:8083}
external.services.notification.send-email=${NOTIFICATION_SERVICE_SEND_EMAIL:/api/notifications/send}
external.services.notification.send-welcome-email=${NOTIFICATION_SERVICE_SEND_WELCOME_EMAIL:/api/notifications/welcome}
external.services.notification.health=${NOTIFICATION_SERVICE_HEALTH:/api/notifications/health}

