# Server Port
server.port=8080

# Exclude Relational DataSource Auto-Configuration for pure MongoDB setup
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# JWT Security Configuration
app.jwt-secret=${JWT_SECRET:9a2f8c4e7b1d3a5f8e0c2b4a6f8d1e3c5b7a9f0e2d4c6b8a1f3e5d7c9b0a2f4e}
app.jwt-expiration-milliseconds=86400000

# MongoDB Credential Variables
spring.data.mongodb.username=${MONGO_USERNAME:sivamurthi}
spring.data.mongodb.password=${MONGO_PASSWORD:sivamurthi}
spring.data.mongodb.database=${MONGO_DATABASE:employee_db}

# MongoDB Atlas Cluster URI
spring.data.mongodb.uri=mongodb+srv://${spring.data.mongodb.username}:${spring.data.mongodb.password}@${MONGO_CLUSTER:cluster0.cqmgg.mongodb.net}/${spring.data.mongodb.database}?retryWrites=true&w=majority&tls=true&tlsAllowInvalidHostnames=true






